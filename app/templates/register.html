{% extends "base.html" %}

{% block title %}Register a Signer{% endblock %}

{% block content %}
<div class="form-page">
    <h1 class="form-title fade-in-up">Register a Signer</h1>
    <p class="form-subtitle fade-in-up delay-1">Add a signer and upload their reference signature for future
        verification.</p>

    <form class="form-card fade-in-up delay-2" action="/register" method="post" enctype="multipart/form-data">
        <div class="form-group">
            <label for="full_name">Full Name</label>
            <input type="text" id="full_name" name="full_name" required placeholder="e.g. Adewale Johnson">
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required placeholder="e.g. adewale@example.com">
        </div>

        <div class="form-group">
            <label for="reference_signature">Reference Signature (image file)</label>
            <div class="file-drop" id="fileDrop">
                <span id="fileDropText">Click to choose an image, or drag one here</span>
                <input type="file" id="reference_signature" name="reference_signature" accept="image/*" required>
            </div>
        </div>

        <button type="submit" class="btn btn-primary btn-full">Register Signer</button>
    </form>
</div>
{% endblock %}
